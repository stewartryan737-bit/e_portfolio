<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/258831ddfd.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Ryan Stewart</div>
        <ul class="nav__link--list">
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Languages</a
            >
          </li>
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Projects</a
            >
          </li>
          <li>
            <a href="" class="nav__link--anchor nav__link--anchor--primary"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
      <div class="flex flex-1">
        <div class="about-me__info row">
          <div class="about-me__info--container">
            <figure class="about-me__picture--mask">
              <img
                src="./assets/me.jpg"
                class="about-me__picture"
                alt="Ryan Stewart"
              />
            </figure>
            <h1 class="about-me__info--title">
              Hey! I'm <strong class="text--blue">Ryan Stewart</strong>
            </h1>
            <p class="about-me__info--para">
              I'm a <strong class="text--blue">front-end developer</strong> with
              a passion for creating dynamic and responsive web applications.
            </p>
            <div class="about-me__links">
              <a
                href="https://github.com"
                target="_blank"
                class="about-me__link"
              >
                <i class="fa-brands fa-github"></i>
              </a>
              <a
                href="https://twitter.com"
                target="_blank"
                class="about-me__link"
              >
                <i class="fa-brands fa-twitter"></i>
              </a>
              <a
                href="https://linkedin.com"
                target="_blank"
                class="about-me__link"
              >
                <i class="fa-brands fa-linkedin"></i>
              </a>
              <a
                href="https://drive.google.com"
                target="_blank"
                class="about-me__link"
              >
                <i class="fas fa-file-pdf"></i>
              </a>
            </div>
          </div>
          <figure class="about-me__img--container">
            <img class="about-me__img"
              src="./assets/undraw_dev-environment_n5by.png"
              alt="Ryan Stewart">
            </figure>
        </div>
      </div>
    </section>
    <section id="languages">
      <div class="container">
        <div class="row">
          <h1 class="section__title">This is my <span class="text--blue">technology stack</span></h1>
          <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/HTML5_Badge.svg" class="language__img"
              />
            </figure>
             <span class="language__name">HTML</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/css-131-722685.png" class="language__img"
              />
            </figure>
              <span class="language__name">CSS</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/javascript-1-225993.png" class="language__img"
              />
            </figure>
              <span class="language__name">JAVA</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/typescript-3521774-2945272.png" class="language__img"
              />
            </figure>
             <span class="language__name">TS</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/vue-282497.png" class="language__img"
              />
            </figure>
             <span class="language__name">VUE</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/nuxt-dot-js-3628959-3030184 (1).png" class="language__img"
              />
            </figure>
             <span class="language__name">NUXT</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/react-3-1175109 (1).png" class="language__img"
              />
            </figure>
             <span class="language__name">REACT</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img class="language__img" src="./assets/mobx.png" class="language__img"
              />
            </figure>
             <span class="language__name">MOBX</span>
          </div>
      </div>
  </section>
  <section id="projects">
    <div class="container">
      <div class="row">
        <h1 class="section__title">Here are some of my <span class="text--blue">projects</span></h1>
        <ul class="projects__list">
          <li class="project">
            <div class="projects__wrapper">
              <img src="" alt="">
            </div>
          </li>
        </ul>
      </div>
    </div>
  </section>
</body>

</html>
